<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshhouse × Code-Ox — Odoo Diet Management System</title>
<style>
:root{
  --ink:#221C15; --ink-soft:#4a4234; --muted:#847a68;
  --paper:#FBF8F3; --paper2:#F1EAD9; --paper3:#E9E0CD;
  --gold:#B4863B; --gold-br:#D9A94E; --gold-deep:#8a6524;
  --green:#2F6B4F; --green-soft:#e5efe7;
  --coral:#D64541; --coral-soft:#f7e6e2;
  --line:rgba(34,28,21,.12); --line2:rgba(34,28,21,.07);
  --panel:#0f0d0a;
  font-synthesis:none;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:#0c0b09; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
/* ---------- stage scaling ---------- */
#viewport{position:fixed; inset:0; display:grid; place-items:center; overflow:hidden}
#stage{
  width:1280px; height:720px; position:relative;
  transform-origin:center center;
  border-radius:6px; overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}
.slide{
  position:absolute; inset:0; background:var(--paper);
  opacity:0; visibility:hidden;
  transition:opacity .5s cubic-bezier(.4,0,.2,1);
  padding:64px 72px;
}
.slide.active{opacity:1; visibility:visible}
.slide.solid-dark{background:var(--ink); color:var(--paper)}
.slide.paper2{background:linear-gradient(160deg,#FBF8F3 0%, #F3ECDD 100%)}

@media (prefers-reduced-motion:reduce){
  .slide{transition:opacity .18s linear}
  .anim{animation:none !important; opacity:1 !important; transform:none !important}
}

/* ---------- chrome ---------- */
#chrome{position:fixed; left:0; right:0; bottom:0; z-index:40; height:46px;
  display:flex; align-items:center; gap:16px; padding:0 20px;
  background:rgba(18,15,11,.55); backdrop-filter:blur(18px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.08); color:#efe7d6}
#bar{flex:1; height:3px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden}
#barfill{height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--gold-br)); transition:width .45s cubic-bezier(.4,0,.2,1)}
#count{font-variant-numeric:tabular-nums; font-size:12.5px; letter-spacing:.02em; color:#c9bda6}
#chrome .nm{font-size:12.5px; color:#9c917c}
.navbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.04); color:#efe7d6; cursor:pointer; font-size:14px; line-height:1;
  display:grid;place-items:center; transition:background .15s, transform .1s}
.navbtn:hover{background:rgba(255,255,255,.12)}
.navbtn:active{transform:scale(.92)}
.hint{position:fixed; top:16px; right:18px; z-index:40; font-size:11.5px; color:#7a715f}

/* ---------- type ---------- */
.kicker{display:inline-flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--gold-deep); letter-spacing:-.01em}
.kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.knum{font-variant-numeric:tabular-nums; color:var(--gold-deep); font-weight:700; font-size:15px}
h1.display{font-size:82px; line-height:.96; letter-spacing:-.035em; font-weight:800; color:var(--ink)}
h2.title{font-size:52px; line-height:1.0; letter-spacing:-.03em; font-weight:800}
h3.sub{font-size:28px; line-height:1.08; letter-spacing:-.02em; font-weight:700}
.lead{font-size:22px; line-height:1.35; letter-spacing:-.012em; color:var(--ink-soft); font-weight:450; max-width:62ch}
.small{font-size:15px; line-height:1.45; color:var(--muted)}
.tag{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:100px; font-size:13.5px; font-weight:600}
.tag.gap{background:var(--coral-soft); color:#a8322e}
.tag.win{background:var(--green-soft); color:#245c42}
.tag.gold{background:#f3e7cf; color:var(--gold-deep)}

/* device + browser frames */
.phone{border-radius:34px; box-shadow:0 26px 50px rgba(34,28,21,.22), 0 4px 12px rgba(34,28,21,.12); display:block}
.browser{border-radius:12px; box-shadow:0 30px 60px rgba(34,28,21,.20), 0 6px 16px rgba(34,28,21,.10);
  border:1px solid var(--line); display:block; width:100%}
.stat-num{font-size:56px; font-weight:800; letter-spacing:-.03em; line-height:1}
.stat-lbl{font-size:15px; color:var(--muted); margin-top:4px}

/* layout helpers */
.row{display:flex}
.col{display:flex; flex-direction:column}
.between{justify-content:space-between}
.center{align-items:center}
.grow{flex:1}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}.gap32{gap:32px}.gap40{gap:40px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt40{margin-top:40px}

.slidehead{display:flex; flex-direction:column; gap:12px}
.slidehead h2{max-width:20ch}

/* cover */
.cover-grid{height:100%; display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center}
.cover-logo{display:flex; align-items:center; gap:12px}
.cover-logo img{height:30px}
.cover-badge{font-weight:800; font-size:19px; letter-spacing:-.02em}
.brandmark{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
.brandmark .glyph{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--gold-br);display:grid;place-items:center;font-size:14px;font-weight:900}
.cover-strip{display:flex; gap:26px; margin-top:26px}
.cover-strip .s .n{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--gold-deep)}
.cover-strip .s .l{font-size:13px;color:var(--muted)}
.cover-art{position:relative; height:100%; display:flex; align-items:center; justify-content:center}
.cover-art .p{position:absolute; border-radius:30px}
.cover-contact{display:flex; gap:18px; align-items:center; font-size:14px; color:var(--ink-soft)}
.cover-contact b{color:var(--ink)}

/* list */
.wins{display:grid; grid-template-columns:1fr 1fr; gap:14px 40px}
.win-item{display:flex; gap:13px; align-items:flex-start}
.win-item .ic{flex:0 0 auto; width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:14px;font-weight:800;margin-top:1px}
.win-item .t{font-size:17.5px; font-weight:650; letter-spacing:-.01em; line-height:1.2}
.win-item .d{font-size:14px; color:var(--muted); line-height:1.3; margin-top:2px}

.gapcols{display:grid; grid-template-columns:1fr 1fr 1fr; gap:22px; margin-top:8px}
.gapcol{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 20px 18px; display:flex;flex-direction:column;gap:12px}
.gapcol .h{display:flex;align-items:center;gap:9px;font-weight:750;font-size:16.5px;letter-spacing:-.01em}
.gapcol .h .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--coral-soft);color:#a8322e}
.gapcol ul{list-style:none; display:flex;flex-direction:column;gap:9px}
.gapcol li{font-size:13.7px; line-height:1.32; color:var(--ink-soft); display:flex; gap:8px}
.gapcol li .n{color:var(--coral); font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto}

/* phones row */
.phones{display:flex; align-items:flex-end; justify-content:center; gap:26px; height:100%}
.phones.tight{gap:20px}
.pcard{display:flex; flex-direction:column; align-items:center; gap:12px}
.pcard img{height:390px; width:auto}
.pcard.sm img{height:360px}
/* phone-showcase slides: header on top, phones fill remaining height (no overlap) */
.slide.pshow{display:flex; flex-direction:column}
.slide.pshow>.row, .slide.pshow>.slidehead{flex:0 0 auto}
.slide.pshow .phones{flex:1 1 auto; min-height:0; align-items:center; margin-top:18px}
.slide.pshow .pcard{justify-content:flex-start; height:100%}
.slide.pshow .pcard img{height:auto; max-height:calc(100% - 70px); width:auto}
.slide.pshow .small{flex:0 0 auto}
.slide.s-ops{display:flex; flex-direction:column}
.pcard .cap{max-width:22ch; text-align:center; font-size:13px; color:var(--muted); line-height:1.32}
.pcard .caph{font-size:13.5px; font-weight:700; color:var(--gold-deep); letter-spacing:-.005em}

/* split */
.split{display:grid; grid-template-columns:1fr 1.15fr; gap:44px; height:100%; align-items:center}
.split.rev{grid-template-columns:1.15fr 1fr}
.feat{display:flex; flex-direction:column; gap:15px}
.feat .f{display:flex; gap:12px; align-items:flex-start}
.feat .f .ic{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:#f3e7cf;color:var(--gold-deep);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.feat .f .t{font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.18}
.feat .f .d{font-size:13.7px;color:var(--muted);line-height:1.3;margin-top:2px}

.livebadge{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#eafff3;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:100px}
.livebadge .b{width:7px;height:7px;border-radius:50%;background:#7ff0b0;box-shadow:0 0 0 0 rgba(127,240,176,.7);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,240,176,.6)}70%{box-shadow:0 0 0 9px rgba(127,240,176,0)}100%{box-shadow:0 0 0 0 rgba(127,240,176,0)}}

/* stat panel (dark) */
.statpanel{background:var(--panel); border-radius:20px; padding:34px 36px; color:var(--paper); display:flex;flex-direction:column;gap:26px}
.statpanel .row1 .n{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--gold-br);line-height:1}
.statpanel .row1 .l{font-size:14.5px;color:#b9ad97;margin-top:5px}
.statpanel .hr{height:1px;background:rgba(255,255,255,.12)}

/* mapping table */
.maptbl{margin-top:6px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff}
.maphead{display:grid;grid-template-columns:1fr 34px 1fr; background:var(--paper2)}
.maphead div{padding:12px 20px; font-size:13px; font-weight:750; letter-spacing:-.005em}
.maphead .a{color:#a8322e}.maphead .b{color:var(--green)}
.maprow{display:grid; grid-template-columns:1fr 34px 1fr; border-top:1px solid var(--line2)}
.maprow>div{padding:11px 20px; font-size:14px; line-height:1.28; display:flex; align-items:center}
.maprow .gap{color:var(--ink-soft)}
.maprow .sol{color:var(--ink); font-weight:550}
.maprow .arr{justify-content:center; color:var(--green); font-weight:800; background:var(--paper)}

/* creds */
.creds{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:8px}
.cred{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px}
.cred .n{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--gold-deep);line-height:1}
.cred .l{font-size:14.5px;color:var(--ink-soft);margin-top:7px;line-height:1.28;font-weight:550}

/* CTA */
.cta-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px}
.cta-step{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px;background:rgba(255,255,255,.03)}
.cta-step .num{font-size:14px;font-weight:800;color:var(--gold-br);font-variant-numeric:tabular-nums}
.cta-step .t{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:10px;color:var(--paper)}
.cta-step .d{font-size:14px;color:#b3a892;margin-top:7px;line-height:1.35}
.contactbar{display:flex;align-items:center;gap:24px;margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);font-size:15px;color:#d8cdb5}
.contactbar b{color:#fff}
.contactbar .who{font-weight:700;color:#fff}

.footline{position:absolute; left:72px; bottom:26px; font-size:12.5px; color:var(--muted)}
.slide.solid-dark .footline{color:#8a8069}

.section-num{font-size:15px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.big-quote{font-size:44px;line-height:1.06;letter-spacing:-.03em;font-weight:750;max-width:22ch}
.accent{color:var(--gold-br)}
.accent-green{color:#7ff0b0}
.mono-fig{font-variant-numeric:tabular-nums}
.underline-gold{box-shadow:inset 0 -12px 0 rgba(217,169,78,.28)}

/* portfolio apps */
.apps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:8px}
.appcard{background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column}
.appcard .shot{height:250px; background:var(--paper2); display:flex; align-items:flex-end; justify-content:center; overflow:hidden}
.appcard .shot img{width:auto; height:238px; object-fit:cover; object-position:top; border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(34,28,21,.12)}
.appcard .body{padding:15px 17px 17px; display:flex; flex-direction:column; gap:5px}
.appcard .nm{font-size:18px; font-weight:750; letter-spacing:-.015em}
.appcard .mk{font-size:12.5px; color:var(--muted)}
.appcard .vol{margin-top:6px; font-size:15px; font-weight:700; color:var(--gold-deep)}
.appcard .vol span{font-size:12px; font-weight:500; color:var(--muted)}

/* module taxonomy */
.modtax{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:6px}
.modcol{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px}
.modcol .h{display:flex; align-items:center; gap:10px; font-size:16.5px; font-weight:750; letter-spacing:-.01em; margin-bottom:12px}
.modcol .h .ic{width:30px;height:30px;border-radius:9px;background:var(--paper2);display:grid;place-items:center;font-size:15px}
.modcol ul{list-style:none; display:flex; flex-direction:column; gap:11px}
.modcol li{font-size:13.6px; line-height:1.3}
.modcol li b{font-weight:650; color:var(--ink); font-size:14px}
.modcol li .d{color:var(--muted); display:block; margin-top:1px}

/* odoo ERP module chips */
.erp{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-top:8px}
.erpcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.erpcard .ic{width:44px;height:44px;border-radius:12px;background:var(--paper2);display:grid;place-items:center;font-size:22px}
.erpcard .t{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.erpcard .d{font-size:12.8px;color:var(--muted);line-height:1.32}

/* e-shop funnel */
.funnel{display:flex; align-items:center; gap:0; margin-top:10px}
.fstep{flex:1; background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 22px; display:flex; flex-direction:column; gap:8px}
.fstep .n{font-size:13px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.fstep .t{font-size:18px;font-weight:750;letter-spacing:-.015em}
.fstep .d{font-size:13.5px;color:var(--muted);line-height:1.32}
.farrow{flex:0 0 auto; width:44px; text-align:center; color:var(--green); font-size:22px; font-weight:800}
.metricrow{display:flex; gap:44px; margin-top:6px}
.metricrow .m .n{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--gold-deep);line-height:1}
.metricrow .m .l{font-size:14px;color:var(--muted);margin-top:5px}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<div class="hint" id="hint">← → to navigate · F fullscreen</div>
<div id="chrome">
  <button class="navbtn" id="prev" aria-label="Previous">‹</button>
  <button class="navbtn" id="next" aria-label="Next">›</button>
  <span class="nm">Freshhouse × Code-Ox</span>
  <div id="bar"><div id="barfill"></div></div>
  <span id="count">01 / 21</span>
</div>

<script>
const IMG = 'img/';
// helper builders
const F = (extra='')=>`<div class="footline">Freshhouse × Code-Ox · Odoo Diet Management System · 22 Sept 2026${extra}</div>`;

const slides = [];

/* 01 COVER */
slides.push(`
<div class="slide solid-dark active" style="overflow:hidden">
  <div style="position:absolute;top:-220px;right:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle at center, rgba(217,169,78,.22), rgba(217,169,78,0) 62%);pointer-events:none"></div>
  <div style="position:absolute;bottom:-260px;left:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at center, rgba(47,107,79,.16), rgba(47,107,79,0) 62%);pointer-events:none"></div>
  <div class="col" style="height:100%;justify-content:center;position:relative;z-index:2;gap:26px">
    <div class="row between center">
      <span class="brandmark" style="color:#fff"><span class="glyph">Cx</span> Code-Ox</span>
      <span class="small" style="font-size:14px;color:#8f846d">Odoo · App Development · AI</span>
    </div>
    <div class="col gap20" style="margin-top:8px">
      <div class="kicker" style="color:var(--gold-br)"><span class="dot"></span> Proposal for Freshhouse</div>
      <h1 class="display" style="color:#fff;font-size:92px">We audited your app.<br><span class="accent">Then we built<br>the fix — already.</span></h1>
      <p class="lead" style="color:#c9bda6;max-width:58ch;font-size:23px">We walked the Freshhouse app end to end and found where its best features are hidden. Every gap already has a solution running in our live Odoo diet platform — and a plan to move it into your funnel.</p>
    </div>
    <div class="cover-contact" style="color:#b3a892;margin-top:14px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12)">
      <span class="who" style="color:#fff;font-weight:700">Shabeeb K</span><span>Head of Operations</span><span>·</span><span>shabeeb.k@code-ox.com</span><span>·</span><span>+966 53 571 6437</span><span>·</span><span>22 Sept 2026</span>
    </div>
  </div>
</div>`);

/* 02 WHAT WE DID */
slides.push(`
<div class="slide">
  <div class="slidehead">
    <div class="kicker"><span class="dot"></span> How we prepared for this</div>
    <h2 class="title">We used your app.<br>Guest, then logged in.</h2>
  </div>
  <div class="split rev mt40" style="height:auto;align-items:flex-start;gap:56px">
    <div class="col gap20">
      <p class="lead">Before writing a word, we signed up with a real account and walked every screen — the guest flow first, then the full logged-in product. This deck is what we found, and what we'd do about it.</p>
      <div class="feat mt8">
        <div class="f"><span class="ic">1</span><div><div class="t">Walked the guest flow</div><div class="d">Menu browsing, subscribe, outlet order, "Talk to us", help desk.</div></div></div>
        <div class="f"><span class="ic">2</span><div><div class="t">Signed in with a live account</div><div class="d">Plans, gram-level customization, pricing, dietitian booking, chat.</div></div></div>
        <div class="f"><span class="ic">3</span><div><div class="t">Compared to what we ship</div><div class="d">Every gap mapped to a feature already live in our Odoo diet system.</div></div></div>
      </div>
    </div>
    <div class="phones tight" style="height:430px">
      <div class="pcard"><img src="${IMG}ph-welcome.png"></div>
      <div class="pcard"><img src="${IMG}ph-login.png" style="margin-bottom:26px"></div>
      <div class="pcard"><img src="${IMG}ph-home.png"></div>
    </div>
  </div>
  ${F()}
</div>`);

/* 03 STRENGTHS */
slides.push(`
<div class="slide paper2">
  <div class="slidehead">
    <div class="kicker" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span> Credit where it's due</div>
    <h2 class="title">Freshhouse already<br>got a lot right.</h2>
  </div>
  <div class="wins mt40">
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Four distinct plans</div><div class="d">Lifestyle, FreshFit (Best Value), High Protein, Flex points & cashback.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Gram-level customization</div><div class="d">Protein / carb portions tuned per meal — genuinely advanced.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Real allergy & dislike filter</div><div class="d">Chicken, red meat, salmon, egg, nuts and more — competitors lack it.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Live pricing by duration</div><div class="d">Per-day breakdown that recalculates as the plan changes.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Dietitian booking</div><div class="d">In-house or online consultations — a premium retention feature.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Native support chat</div><div class="d">"Fresh Chat" with text, voice notes, attachments, one-tap call.</div></div></div>
    <div class="win-item"><span class="ic">✓</span><div><div class="t">Loyalty layer</div><div class="d">Fresh Me Points and Flex Points already in the product.</div></div></div>

/* ---------- render + nav ---------- */
const stage = document.getElementById('stage');
stage.innerHTML = slides.join('');
const slideEls = [...stage.querySelectorAll('.slide')];
const total = slideEls.length;
let cur = 0;
const barfill = document.getElementById('barfill');
const count = document.getElementById('count');
const pad = n => String(n).padStart(2,'0');

function show(i){
  i = Math.max(0, Math.min(total-1, i));
  slideEls[cur].classList.remove('active');
  slideEls[i].classList.add('active');
  cur = i;
  barfill.style.width = ((i+1)/total*100)+'%';
  count.textContent = pad(i+1)+' / '+pad(total);
}
function nextS(){ show(cur+1) }
function prevS(){ show(cur-1) }

document.getElementById('next').onclick = nextS;
document.getElementById('prev').onclick = prevS;
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault(); nextS()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault(); prevS()}
  else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(total-1)}
  else if(e.key.toLowerCase()==='f'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen() }
});
// click right/left half to navigate
stage.addEventListener('click', e=>{
  const x = e.clientX - stage.getBoundingClientRect().left;
  (x > stage.getBoundingClientRect().width*0.5) ? nextS() : prevS();
});

// hide hint after a bit
setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 4200);
document.getElementById('hint').style.transition='opacity .8s';

// scale stage to viewport (letterbox)
function fit(){
  const vp = document.getElementById('viewport');
  const s = Math.min(vp.clientWidth/1280, (vp.clientHeight-46)/720);
  stage.style.transform = 'scale('+s+')';
  document.getElementById('viewport').style.paddingBottom='46px';
}
addEventListener('resize', fit); fit();
show(0);
</script>
